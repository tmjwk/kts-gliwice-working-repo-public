<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 1.7.3: piłka KTS GLIWICE ★★★ 40+ na kaflu klubowym — ten sam wzór
       co sprite #pilka-kts na stronie (nadruk powiększony na życzenie Tomka:
       napis ma być dobrze widoczny). Font celowo systemowy: favicon
       renderuje się bez strony, bez fontów Google — rozmiar 13/120 mieści
       napis na łuku nawet z szerokim fallbackiem Arial (na Linuksie/Androidzie),
       więc litery z końców nie są ucinane (w 1.7.0 przy Arialu wychodziły
       poza łuk o ~14% — nieszkodliwe w 16 px, ale brzydkie w większych kaflach). -->
  <defs>
    <radialGradient id="kula" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fdfcf8"/>
      <stop offset="75%" stop-color="#ece8dd"/>
      <stop offset="100%" stop-color="#d9d4c5"/>
    </radialGradient>
    <path id="gw" d="M0,-9 L2.02,-2.78 L8.56,-2.78 L3.27,1.07 L5.29,7.29 L0,3.44 L-5.29,7.29 L-3.27,1.07 L-8.56,-2.78 L-2.02,-2.78 Z"/>
    <path id="luk" d="M 16 46 A 70 70 0 0 1 104 46" fill="none"/>
  </defs>
  <rect width="120" height="120" rx="22" fill="#0057B8"/>
  <g transform="translate(60,60) scale(0.95) translate(-60,-60)">
    <circle cx="60" cy="60" r="57" fill="url(#kula)"/>
    <text font-family="Arial Narrow, Arial, sans-serif" font-size="13" font-weight="700" fill="#0057b8" letter-spacing="0.4" stroke="#0057b8" stroke-width="0.5" paint-order="stroke fill">
      <textPath href="#luk" startOffset="50%" text-anchor="middle">KTS GLIWICE</textPath>
    </text>
    <use href="#gw" transform="translate(40 68)" fill="#0057b8"/>
    <use href="#gw" transform="translate(60 68)" fill="#0057b8"/>
    <use href="#gw" transform="translate(80 68)" fill="#0057b8"/>
    <text x="60" y="92" font-family="Arial Narrow, Arial, sans-serif" font-size="13" font-weight="700" fill="#0057b8" text-anchor="middle" letter-spacing="0.4" stroke="#0057b8" stroke-width="0.5" paint-order="stroke fill">40+</text>
  </g>
</svg>
