<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- 1.7.0: piłka KTS GLIWICE ★★★ 40+ na kaflu klubowym — ten sam wzór
       co sprite #pilka-kts na stronie (demo „piłeczka en face", plan B
       bez cudzego znaku towarowego). Font celowo systemowy: favicon
       renderuje się bez strony, bez fontów Google. -->
  <defs>
    <radialGradient id="kula" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fdfcf8"/>
      <stop offset="75%" stop-color="#ece8dd"/>
      <stop offset="100%" stop-color="#d9d4c5"/>
    </radialGradient>
    <path id="gw" d="M0,-6.5 L1.46,-2.01 L6.18,-2.01 L2.36,0.77 L3.82,5.26 L0,2.48 L-3.82,5.26 L-2.36,0.77 L-6.18,-2.01 L-1.46,-2.01 Z"/>
    <path id="luk" d="M 28 62 A 42 42 0 0 1 92 62" fill="none"/>
  </defs>
  <rect width="120" height="120" rx="22" fill="#0057B8"/>
  <g transform="translate(60,60) scale(0.95) translate(-60,-60)">
    <circle cx="60" cy="60" r="57" fill="url(#kula)"/>
    <text font-family="Arial Narrow, Arial, sans-serif" font-size="11" font-weight="700" fill="#0057b8" letter-spacing="1">
      <textPath href="#luk" startOffset="50%" text-anchor="middle">KTS GLIWICE</textPath>
    </text>
    <use href="#gw" transform="translate(43 75)" fill="#0057b8"/>
    <use href="#gw" transform="translate(60 75)" fill="#0057b8"/>
    <use href="#gw" transform="translate(77 75)" fill="#0057b8"/>
    <text x="60" y="92" font-family="Arial Narrow, Arial, sans-serif" font-size="10" font-weight="700" fill="#0057b8" text-anchor="middle" letter-spacing="1">40+</text>
  </g>
</svg>
