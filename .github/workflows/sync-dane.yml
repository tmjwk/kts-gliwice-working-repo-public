name: Sync danych ligowych (KTS Gliwice)

# Pełna automatyzacja dla hostingu statycznego (GitHub Pages):
#   ŚZTS (ligi 2–4 + amatorzy) — Actions sam pobiera ligi.slzts.pl,
#   PZTS (1. liga) — Actions pobiera pzts.pl PRZEZ CZYTNIK r.jina.ai
#   (usługa headless-browser omijająca Cloudflare; parsuje Markdown:
#   terminarz + tabela 1. ligi gr. południowej).
#   Zmienna PZTS_MECZE (wklejka ręczna) pozostaje jako BACKUP —
#   ma priorytet nad czytnikiem, gdy jest podana.
#   Opcjonalny sekret JINA_API_KEY (Authorization: Bearer) zabezpiecza
#   na wypadek blokady anonimowego ruchu z IP runnera.
#   Rollback strony: osobny workflow „Rollback strony” (rollback.yml).

on:
  schedule:
    # BAZOWY (od 28.09): co 2 godziny = 12 uruchomień/dobę × 4 strony
    # ligowe = 48 zapytań dziennie (≈ 2/godz. — spokojne dla ligi.slzts.pl).
    # Częstotliwość zmienia się JEDNĄ cyfrą: */1 = co godzinę, */4 = co 4 h.
    # Puste przebiegi (brak zmian w źródłach) nie tworzą commitów
    # ani przebudów strony.
    - cron: "23 */2 * * *"
    # DOGRZANIE WIECZORÓW MECZOWYCH (od 07.10.2026): co godzinę, 16–22 UTC.
    # ⚠ Harmonogramy GitHuba liczą czas w UTC, nie w polskim! 16–22 UTC
    # = 18:41–00:41 czasu letniego (CEST) i 17:41–23:41 zimowego (CET)
    # po zmianie czasu 25.10 — okno celowo szerokie na ±1 h, BEZ edycji.
    # Codziennie i bez filtra dni, bo mecze KTS wypadają we wszystkie
    # dni tygodnia (pt 39 · czw 30 · śr 16 · sob 5 · pon 4 · ndz 3 ·
    # wt 1 — dane z 07.10), starty niemal zawsze 18:00–19:00, wyniki
    # lądują 20:00–24:00 → najdalej ~40 min po publikacji w źródle.
    # Minuta :41 — rozsunięcie od bazy (:23) i od pełnych godzin
    # (kongestja crona GitHuba na :00). Plan B, gdyby nie starczyło:
    # Google Sheets + Apps Script (§4.31/§5.21 zapisu rozmowy — odłożone).
    - cron: "41 16-22 * * *"
  workflow_dispatch:
    inputs:
      pzts_mecze:
        description: "Opcjonalnie: JSON z meczami PZTS 1. ligi (wklej z warsztatu)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # ZAPAS NA „ZAMULANIE" ŚZTS: najdłuższy dotąd run ~33 min (30.09, wieczór
    # meczowy). Domyślny limit Actions to 6 h — zawieszone połączenie trzymałoby
    # runnera pół dnia. 50 min = górna granica zdrowego runu + margines.
    timeout-minutes: 50
    # Równoległe starty (schedule + ręczny dispatch) kolejkujemy — dwa runy
    # naraz nadpisałyby sobie runs.json (ostatni wygrywa, wpis przepada).
    concurrency:
      group: sync-dane
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Pobierz dane ligowe
        id: sync
        run: bun scripts/sync_statyczny.ts
        env:
          PZTS_MECZE: ${{ inputs.pzts_mecze }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}

      # Od v1.5.2: runs.json zapisywany PRZY KAŻDYM uruchomieniu (także pustym)
      # → commit powstaje zawsze (panel „Automat: ✓/✗" na stronie). Historia
      # dane.json pozostaje czysta (skrypt nadal nie zapisuje go bez zmian).
      # if:always() — wpis o BŁĘDZIE odczytu (✗) też musi dotrzeć na stronę.
      - name: Commit (dane + dziennik przebiegów; także przy błędzie)
        if: always()
        run: |
          git config user.name "kts-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f runs.json ]; then git add dane.json runs.json; else git add dane.json; fi
          if git diff --cached --quiet; then
            echo "Brak zmian — dane aktualne."
          else
            if [ "${{ steps.sync.outcome }}" = "success" ]; then
              git commit -m "sync: dane ligowe $(date -u '+%Y-%m-%d %H:%M UTC')"
            else
              git commit -m "sync: przebieg z błędem odczytu $(date -u '+%Y-%m-%d %H:%M UTC')"
            fi
            git push
          fi
