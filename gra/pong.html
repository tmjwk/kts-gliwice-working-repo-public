<style>
  :root{
    --club-accent:#c0492b;          /* [A-04] kolor przewodni klubu — podmień */
    --bg:#0b0b0d; --panel:#131316; --line:#26262b;
    --ink:#e8e6e1; --ink-dim:#8d8d94;
    --mono:ui-monospace,"SF Mono","Cascadia Mono","IBM Plex Mono",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--mono);
    display:flex;flex-direction:column;overflow:hidden;
    overscroll-behavior:none;user-select:none;-webkit-user-select:none;
    touch-action:none;  /* v0.3.0: CAŁY ekran steruje grą — dotyk nie scrolluje */
  }
  /* pasek górny — minimalny, z akcentem klubu */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 14px;border-bottom:1px solid var(--line);
    font-size:12px;letter-spacing:.14em;color:var(--ink-dim);
    flex:0 0 auto;text-transform:uppercase;
  }
  header b{color:var(--ink);font-size:14px;letter-spacing:.3em}
  header .club{color:var(--club-accent)}
  header .ver{color:#8d8d94;font-size:10px;letter-spacing:.06em}
  /* scena gry — kort 4:3…16:9; telefon w poziomie: ramki 1/6 ekranu; poza tym letterbox */
  #stage{
    flex:1 1 auto;min-height:0;position:relative;display:flex;
    align-items:center;justify-content:center;padding:10px;
  }
  #screen{
    display:block;background:#000;
    border:1px solid var(--line);border-radius:10px;
    box-shadow:0 0 0 6px #050506, 0 18px 60px rgba(0,0,0,.55) inset;
    touch-action:none;
    image-rendering:auto;
  }
  /* subtelne scanlines CRT (do usunięcia: usuń ::after) */
  #stage::after{
    content:"";position:absolute;inset:10px;pointer-events:none;border-radius:10px;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  /* pasek dolny — sterowania */
  footer{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:8px 14px;border-top:1px solid var(--line);
    flex-wrap:wrap;font-size:11px;letter-spacing:.1em;
  }
  .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  button{
    font:inherit;color:var(--ink-dim);background:transparent;
    border:1px solid var(--line);border-radius:6px;padding:7px 12px;
    letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
    transition:color .12s,border-color .12s;
  }
  button:hover{color:var(--ink)}
  button.on{color:var(--club-accent);border-color:var(--club-accent)}
  .hint{color:#55555c;font-size:10px;letter-spacing:.08em}
  /* stopka z „audio śpi” — pulsuje kolorem klubu, aż gracz da pierwszy gest */
  .hint.muted{color:var(--club-accent);animation:hintPulse 1.6s ease-in-out infinite}
  @keyframes hintPulse{50%{opacity:.3}}
  @media (max-width:560px){
    header{font-size:10px;padding:6px 10px}
    header b{font-size:12px;letter-spacing:.22em}
    footer{padding:6px 10px;justify-content:center}
    .hint{display:none}
  }
</style>

<body>

<header>
  <span><b>PONG</b>&nbsp;· 1972 REPLICA&nbsp;<span class="ver">v0.3.8</span></span>
  <!-- [A-04] podmień na nazwę klubu / wstaw logo (patrz docs) -->
  <span class="club">TABLE TENNIS CLUB</span>
</header>

<div id="stage"><canvas id="screen" width="1496" height="1122"></canvas></div>

<footer>
  <div class="grp">
    <button id="bexit">Exit</button>
    <button id="b1p">1 Player</button>
    <!-- v0.2.1: „2 Players” ukryte do czasu serwera multiplayer (decyzja Ciby).
         Kod trybu 2P (klawisze, dwie paletki dotykowe, sideFor) pozostaje —
         usuń atrybut hidden, by przywrócić przycisk. -->
    <button id="b2p" hidden>2 Players</button>
  </div>
  <span class="hint" id="hint">W/S · ↑/↓ · MOUSE · TOUCH (DRAG)</span>
  <div class="grp">
    <button id="bside">Player: Right</button>
    <button id="bto">Game to 11</button>
    <button id="bsnd">Sound: Off</button>
  </div>
</footer>

<script>
"use strict";
/* ============================================================================
   JEDNOSTKI GRY = jednostki oryginalnego sprzętu.
   Kort: wysokość 246 linii (jak oryginał), szerokość 374–500 cykli (adaptacyjna).
   x rośnie w prawo, y w dół.
   Krok symulacji = 1 pole (1/60.054 s). Wszystkie ruchy są całkowite
   (dyskretne) — dokładnie jak w sprzęcie TTL („slipping counter").
   ========================================================================== */
const CY_MIN = 374, CY_MAX = 500;             // zakres szerokości kortu: 4:3 … 16:9 (v0.3.0, §12/§14)
const CY_PHONE_MAX = 954;                     // telefon w poziomie: cap = sama ramka 1/6 (bez kapu 16:9)
/* margines paletki od krawędzi kortu: ~4,5% szerokości (16-44 cykli) —
   paletki zawsze przy SAMEJ krawędzi kortu, niezależnie od proporcji okna */
const padEdge = w => Math.max(16, Math.min(44, Math.round(w * 0.045)));
let   VIS_W = CY_MIN;                         // szerokość kortu (cykle) — ADAPTACYJNA (§12)
const VIS_H = 246;                            // wysokość kortu (linie) — jak oryginał
const FIELD_HZ = 7159000 / (455 * 262);       // 60.054 Hz
const FIELD_MS = 1000 / FIELD_HZ;

let   NET_X = 187;                            // v0.3.7: środek dla 374 cykli; classic=1: 175 [T5]
let   PAD_X1 = 17, PAD_X2 = 353;              // start = layout dla 374 cykli (ustawia applyCourt)
const PAD_W   = 4,  PAD_H  = 15;              // paletka 4 cykle × 15 linii
const BALL    = 4;                            // piłka 4×4
const GAP_TOP = 16, GAP_BOT = 8;              // [T1] szczeliny zakresu paletki (kalibracja)
const PAD_MIN = GAP_TOP, PAD_MAX = VIS_H - PAD_H - GAP_BOT + 1; // 16..223

let   SERVE_X = NET_X + 1;                    // [T2] tuż na prawo od siatki
let   SC1 = [33, 65], SC2 = [305, 337];       // okna wyniku [dziesiątki, jedności] — przy paletkach
const SERVE_FIELDS = Math.round(1.708 * FIELD_HZ);  // 1,708 s = 103 pola (555: 330k×4,7uF)
const GAMEOVER_FIELDS = Math.round(5 * FIELD_HZ);    // „attract" po końcu gry → auto-restart
const COUNT_FIELDS = Math.round(2.4 * FIELD_HZ);     // v0.3.0: odliczanie 3-2-1 (3 × 0,8 s)

const SPEED_BY_HITS = h => h >= 12 ? 4 : (h >= 4 ? 3 : 2);   // 2/3/4 cykle/pole
const ZONE_VY = [-3, -2, -1, 0, 0, 1, 2, 3];                // strefy paletki 8×2 linii
const AI_SPEED = 2.9;                                        // linie/pole (dodatek, nie oryginał)
const AI_ERR  = h => Math.min(11, 2 + h);                   // „ludzki” błąd celowania (rośnie z wymianą)
const KEY_SPEED = 3;                                         // linie/pole dla klawiatury

/* Dźwięki — bity licznika pozycji pionowej piłki (ic_a3): QA=491,7 Hz,
   QB=245,8 Hz; czasy: paletka do ~16,3 ms, ściana = 1 pole, punkt = 555 242 ms. */
const SND_HIT = { f: 491.7, d: () => 0.007 + Math.random() * 0.0093 }; // 7-16,3 ms [T3]
const SND_WALL = { f: 245.8, d: () => 0.0166 };
const SND_SCORE = { f: 245.8, d: () => 0.242 };

/* --- stan gry ------------------------------------------------------------ */
const G = {
  mode: 1,                 // 1 = gracz vs AI, 2 = dwóch graczy
  side: 2,                 // 1P: strona GRACZA — 2 = prawa (domyślnie, v0.3.0), 1 = lewa
  target: 11,              // „Game Won" — przełącznik operatora 11/15
  state: "count",          // count | serve | play | gameover (attract freeze)
  countF: COUNT_FIELDS,    // v0.3.0: odliczanie 3-2-1 przed startem (w polach)
  serveTimer: SERVE_FIELDS,
  serveDir: Math.random() < .5 ? -1 : 1,   // pierwsza „moneta" — kierunek dowolny
  serveVy: 0,              // prędkość pionowa zachowana z pudła (serwis oryginału)
  score: [0, 0],
  hits: 0,                 // licznik uderzeń wymiany (prędkość pozioma)
  ball: { x: 0, y: 0, vx: 2, vy: 0 },
  pads: [ { top: 115 }, { top: 115 } ],    // [T1] zakres 16..223
  overTimer: 0,
  fields: 0,                 // licznik pól (testy/kalibracja T1–T7)
  aiErr: 0, aiComing: false, // błąd celowania AI / czy piłka leci w jego stronę
};
const aiIdx = () => (G.mode === 1 ? (G.side === 1 ? 1 : 0) : -1);  // indeks paletki AI (-1 = 2P)

/* --- dźwięk (WebAudio; odblokowanie po 1. interakcji) ----------------------
   v0.1.2 — niezawodność: audio potrafi umrzeć na kilka sposobów i każdy dawał
   objaw „dźwięk nie zawsze działa”:
   (1) polityka autoplay — kontekst śpi do 1. GESTU; samo prowadzenie paletki
       myszą (pointermove bez kliku) go nie budzi;
   (2) system usypia kontekst po powrocie z tła / przerwaniu (iOS „interrupted”);
   (3) iOS/WebKit domyka audio dopiero BUFOREM odegranym w geście;
   (4) beep zaplanowany w ZAWIESZONYM kontekście czeka na zamrożonym zegarze
       i piętrzy się — po wznowieniu byłby „wybuch” starych dźwięków naraz;
   (5) jednokrotny unlock — gdy (2) zdarzyło się PO nim, nic nie wznawiało.
   v0.2.1 — „na początku gry brak dźwięku”: do 1. gestu gracza (klik / klawisz /
   dotyk — NIE sam ruch myszy) kontekst śpi z powodu polityki autoplay, a każdy
   beep z tego czasu był GUBIONY. Gracz zaczynał więc cicho, a dźwięk pojawiał
   się dopiero po jego pierwszym geście — po kilku odbiciach/sekundach gry,
   stąd wrażenie losowości („nie wiem od czego to zależy”). Teraz beep-y
   spadające na śpiący kontekst są ODŁOŻONE (Snd.pending, ≤4, tylko ostatnia
   sekunda) i odgrywane natychmiast po wznowieniu (Snd.flush, rozstrzelone
   o 35 ms). Planowanie następuje dopiero na BIEGNĄCYM zegarze → nic się nie
   piętrzy, a gracz tuż po pierwszym geście słyszy dźwięk — potwierdzenie,
   że audio żyje. Budzenie: KAŻDY gest — pointerdown/up, touchstart/end,
   click, klawisz; refleks onstatechange; powrót z tła; cichy burst (iOS).   */
const Snd = {
  ctx: null, lp: null, master: null, on: false,
  burstDone: false, t0: 0,
  pending: [],                                   // beep-y odłożone do resume
  init() {
    if (this.ctx) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    this.ctx = new C();
    this.lp = this.ctx.createBiquadFilter();            // „głośnik TV"
    this.lp.type = "lowpass"; this.lp.frequency.value = 3200; this.lp.Q.value = .4;
    this.master = this.ctx.createGain(); this.master.gain.value = .42;
    this.lp.connect(this.master); this.master.connect(this.ctx.destination);
    /* system uśpił kontekst (tło/przerwanie)? — budź się odruchowo */
    this.ctx.onstatechange = () => { this.recover(); this.flush(); refreshHint(); };
  },
  recover() {
    if (!this.ctx || !this.on) return;
    const s = this.ctx.state;                   // "suspended" | "interrupted" (iOS)
    if (s === "suspended" || s === "interrupted")
      this.ctx.resume().then(() => this.flush()).catch(() => {});
    this.flush();            // działa już? → oddaj beep-y odłożone podczas snu
  },
  running() { return !!this.ctx && this.ctx.state === "running"; },
  /* cichy bufor odegrany W geście — domyka obwód audio na iOS/WebKicie */
  burst() {
    if (!this.ctx || this.burstDone) return;
    this.burstDone = true;
    try {
      const s = this.ctx.createBufferSource();
      s.buffer = this.ctx.createBuffer(1, 1024, this.ctx.sampleRate);  // cisza
      s.connect(this.master); s.start(0);
    } catch (_) {}
  },
  play(f, dur, lead) {                    // planowanie beep-u na biegnącym zegarze
    /* Wyprzedzenie ≥2 ms: AudioContext renderuje kwantami po 128 próbek (~3 ms)
       — start dokładnie „teraz" potrafi zjeść niemal cały krótki beep odbicia
       (objaw: „czasem brak dźwięku" po uderzeniu paletki). */
    const t = this.ctx.currentTime + lead;
    const o = this.ctx.createOscillator(); o.type = "square"; o.frequency.value = f;
    const g = this.ctx.createGain();
    const rel = Math.min(.0025, dur * .3);       // płaski szczyt + krótkie zejście
    g.gain.setValueAtTime(.62, t);
    g.gain.setValueAtTime(.62, Math.max(t, t + dur - rel));
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(this.lp);
    o.start(t); o.stop(t + dur + .02);
    this.t0 = t;                                 // diagnostyka (testy automat.)
  },
  flush() {                       // odegraj to, co wpadło, gdy audio spało
    if (!this.ctx || this.ctx.state !== "running" || !this.pending.length) return;
    const now = performance.now();
    const live = this.pending.filter(p => now - p.due <= 1000);   // tylko ostatnia sekunda
    this.pending.length = 0;
    live.forEach((p, i) => this.play(p.f, p.dur, .002 + i * .035));
  },
  beep(f, dur) {
    if (!this.on || !this.ctx) return;
    if (this.ctx.state !== "running") {
      this.recover();                            // może właśnie ktoś dał gest?
      if (this.ctx.state !== "running") {
        /* kontekst śpi (autoplay do 1. gestu / tło / iOS): NIE gub beep-a —
           odłóż go; odegra się w ułamku sekundy po resume. Planowanie tylko
           na biegnącym zegarze = nic nie czeka na zamrożonym czasie        */
        this.pending.push({ f, dur, due: performance.now() });
        if (this.pending.length > 4) this.pending.shift();
        return;
      }
    }
    this.play(f, dur, .002);
  }
};
const snd = n => Snd.beep(n.f, n.d());

/* --- render ---------------------------------------------------------------
   Kanwa (VIS_W×4)×1122 (= 4 px / cykl; 1122/246 ≈ 4,561 px / linii) — te
   same proporcje jednostek co oryginał; szerokość kortu dobiera applyCourt. */
const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");
const PX = x => x * 4;
const PY = y => y * (1122 / 246);
const PH = h => h * (1122 / 246);

const C_WHITE = "#f2f2ee", C_SCORE = "#cfcdc7";   // wynik ~17% ciemniej (R 1,2k)

/* Cyfry 7-segmentowe — geometria dekodera 7448 + bramki (asymetria: górne
   piony 12 linii, dolne 16; poprzeczne 16 cykli długości, 4 linie grubości). */
const SEG = {
  0: "abcdef", 1: "bc", 2: "abged", 3: "abgcd", 4: "fgbc",
  5: "afgcd", 6: "afgedc", 7: "abc", 8: "abcdefg", 9: "abcdfg"
};
function drawDigit(d, x0, y0, k = 1) {          // k = skala (1 = wynik; 2 = odliczanie 3-2-1)
  const s = SEG[d] || "";
  ctx.fillStyle = C_SCORE;
  const R = (x, y, w, h) => ctx.fillRect(PX(x0 + x * k), PY(y0 + y * k), PX(w * k), PH(h * k));
  if (s.includes("a")) R(0, 0, 16, 4);        // górna
  if (s.includes("f")) R(0, 0, 4, 12);        // lewy górny pion (12 linii)
  if (s.includes("b")) R(12, 0, 4, 12);       // prawy górny pion
  if (s.includes("g")) R(0, 12, 16, 4);       // środkowa
  if (s.includes("e")) R(0, 16, 4, 16);       // lewy dolny pion (16 linii)
  if (s.includes("c")) R(12, 16, 4, 16);      // prawy dolny pion
  if (s.includes("d")) R(0, 28, 16, 4);      // dolna
}
function drawScore(side) {                     // okna zakotwiczone przy paletkach (applyCourt)
  const sc = G.score[side];
  const [tens, units] = side === 0 ? SC1 : SC2;
  if (sc >= 10) drawDigit(1, tens, 16);        // dziesiątki: tylko „1" (7448 gasi zero)
  drawDigit(sc % 10, units, 16);
}
const VERSION = "0.3.8";      // jedno źródło prawdy o wersji — nagłówek,
const RELEASE = "2026-11-07"; // tytuł karty, kort, meta, version.json, postMessage
function drawVersion() {      // nr wersji małymi 7-seg. na dole kortu (od v0.3.1, życzenie Ciby)
  const k = 0.5, y0 = VIS_H - 22;              // skala ½ cyfry wyniku, linia 224..240
  let wTot = 0;
  for (const ch of VERSION) wTot += (ch === "." ? 8 : 20) * k;
  let x = (VIS_W - wTot) / 2;                  // wyśrodkowane (kropka = blok 4×4 przy podstawie)
  for (const ch of VERSION) {
    if (ch === ".") {
      ctx.fillStyle = C_SCORE;
      ctx.fillRect(PX(x + 4 * k), PY(y0 + 27 * k), PX(4 * k), PH(4 * k));
      x += 8 * k;
    } else { drawDigit(+ch, x, y0, k); x += 20 * k; }
  }
}

function render() {
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, cv.width, cv.height);

  /* siatka: 1 cykl szerokości, kreski 4 linie co 8 (V mod 8 ∈ 0..3) [T5].
     v0.3.7: DOKŁADNIE na środku — 4-pikselowa kreska zostaje przesunięta
     2 px w lewo od osi cykli, żeby objąć oś pikselową kanwy: lewa i prawa
     połowa równe CO DO PIKSELA przy KAŻDEJ szerokości kortu (parzystej
     i nieparzystej — asercja testowa bierze piksele z kanwy, nie logikę).
     ?classic=1 rysuje jak oryginał 1972: na siatce cykli, 12 cykli w
     lewo od środka (x=175) — celowo zachowana quirka muzealna. */
  ctx.fillStyle = C_WHITE;
  const netPx = FORCE_CLASSIC ? PX(NET_X) : (cv.width - PX(1)) / 2;
  for (let y = 0; y < VIS_H; y += 8) ctx.fillRect(netPx, PY(y), PX(1), PH(4));

  if (G.state !== "gameover") {                // w attract paletki znikają
    ctx.fillRect(PX(PAD_X1), PY(G.pads[0].top), PX(PAD_W), PH(PAD_H));
    ctx.fillRect(PX(PAD_X2), PY(G.pads[1].top), PX(PAD_W), PH(PAD_H));
  }
  if (G.state !== "serve" && G.state !== "count") {   // przed serwem/w odliczaniu piłki brak
    ctx.fillRect(PX(G.ball.x), PY(G.ball.y), PX(BALL), PH(BALL));
  }
  if (G.state === "count")                     // v0.3.0: wielka cyfra 3/2/1 na środku kortu
    drawDigit(Math.max(1, Math.ceil(G.countF / (COUNT_FIELDS / 3))),
              (VIS_W - 32) / 2, (VIS_H - 64) / 2, 2);
  drawScore(0); drawScore(1);                  // wynik zostaje też po końcu gry
  if (G.state === "count" || G.state === "gameover")   // v0.3.1: nr wersji na kortu
    drawVersion();
}

/* --- kroki symulacji (1 krok = 1 pole 60,054 Hz) --------------------------- */
const clampPad = v => Math.max(PAD_MIN, Math.min(PAD_MAX, Math.round(v)));

function stepPads() {
  const p1 = G.pads[0], p2 = G.pads[1];
  /* klawiatura — pozycyjnie jak pokrętło, w krokach 3 linie/pole.
     v0.3.0: w 1P człowiek gra po WYBRANEJ stronie (domyślnie PRAWA);
     W/S i strzałki prowadzą paletkę GRACZA, AI gra przeciwną stroną.
     W 2P bez zmian: W/S = lewa, strzałki = prawa. */
  if (G.mode === 2) {
    if (keys.p1u) p1.top = clampPad(p1.top - KEY_SPEED);
    if (keys.p1d) p1.top = clampPad(p1.top + KEY_SPEED);
    if (keys.p2u) p2.top = clampPad(p2.top - KEY_SPEED);
    if (keys.p2d) p2.top = clampPad(p2.top + KEY_SPEED);
  } else {
    const hp = G.side === 1 ? p1 : p2;        // paletka gracza (1P)
    if (keys.p1u || keys.p2u) hp.top = clampPad(hp.top - KEY_SPEED);
    if (keys.p1d || keys.p2d) hp.top = clampPad(hp.top + KEY_SPEED);
    /* AI (dodatek — w oryginale brak): przewiduje punkt przechwytu (z odbiciami
       od ścian) zamiast gonić piłkę — czysty tracker (2,2 < 3 linie/pole)
       przegrywał z każdym ostrym serwisem. Celowanie ma „ludzki” błąd,
       rosnący z długością wymiany, więc w długich wymianach AI da się
       pokonać. Strona AI = przeciwna do strony gracza (v0.3.0). */
    const ai = aiIdx();
    const ap = G.pads[ai];
    const ax = ai === 0 ? PAD_X1 : PAD_X2;
    const b = G.ball;
    const towards = (b.vx > 0) === (ai === 1);          // piłka leci W stronę AI?
    let target;
    if (G.state === "play" && towards) {
      const t = Math.max(0, (ax - BALL + 1 - b.x) / b.vx);     // pola do kontaktu
      const H = VIS_H - BALL;                                   // zakres góry piłki
      let y = b.y + b.vy * t;                                   // tor + odbicia od ścian
      y = ((y % (2 * H)) + 2 * H) % (2 * H);
      if (y > H) y = 2 * H - y;                                 // załamanie trójkątne
      target = y + (BALL - PAD_H) / 2 + G.aiErr;                // środek paletki ± błąd
    } else {
      target = (VIS_H - PAD_H) / 2;                             // postawa „gotowa”
    }
    const dy = target - ap.top;
    if (Math.abs(dy) >= 1)
      ap.top = clampPad(ap.top + Math.max(-AI_SPEED, Math.min(AI_SPEED, dy)));
  }
  /* cel wskaźnika prowadzi paletkę — v0.3.6: MYSZ ustawia go bezpośrednio
     (potencjometr), PALEC/rysik prowadzi DELTAMI przeciągania (zero
     przeskoków po odłożeniu i położeniu palca gdzie indziej). v0.3.0: dotyk
     CAŁEGO EKRANU prowadzi paletkę gracza (w 2P: połowa ekranu/gracza).
     v0.3.1: w 1P slot AI NIGDY nie ma celu wskaźnika — po zmianie strony
     stary cel z byłego slotu gracza „zamrażał" paletkę AI na zawsze. */
  if (G.mode === 1) pointer[G.side === 1 ? 1 : 0] = null;
  if (pointer[0] != null) p1.top = clampPad(pointer[0]);
  if (pointer[1] != null) p2.top = clampPad(pointer[1]);
}

function bounceWalls() {
  const b = G.ball;
  if (b.y < 0) { b.y = -b.y; b.vy = -b.vy; return true; }
  if (b.y > VIS_H - BALL) { b.y = 2 * (VIS_H - BALL) - b.y; b.vy = -b.vy; return true; }
  return false;
}

function paddleHit(p, px) {
  const b = G.ball;
  /* okno zderzenia: 4+4=8 cykli; skok piłki ≤4/pole → brak tunelowania */
  if (!(b.x < px + PAD_W && b.x + BALL > px)) return false;
  if (!(b.y < p.top + PAD_H && b.y + BALL > p.top)) return false;
  /* tylko gdy piłka wchodzi NA paletkę (zapobiega wielokrotnemu HIT):
     piłka leci w lewo (vx<0) → może uderzyć tylko LEWĄ paletkę; itd. */
  const entering = b.vx < 0 ? px === PAD_X1 : px === PAD_X2;
  if (!entering) return false;
  /* strefa = PIERWSZA (najwyższa) wspólna linia rastera [Holden §zderzenia] */
  const first = Math.max(b.y, p.top);
  const zone = Math.min(7, Math.max(0, Math.floor((first - p.top) / 2)));
  b.vy = ZONE_VY[zone];
  b.vx = -b.vx;
  G.hits++;
  snd(SND_HIT);
  return true;
}

function stepBall() {
  const b = G.ball;
  b.x += b.vx; b.y += b.vy;                    // dyskretne kwanty ruchu oryginału

  if (bounceWalls() && G.state === "play") snd(SND_WALL);

  if (G.state === "play") {
    const wasComing = G.aiComing;
    paddleHit(G.pads[0], PAD_X1);
    paddleHit(G.pads[1], PAD_X2);
    b.vx = Math.sign(b.vx) * SPEED_BY_HITS(G.hits);
    G.aiComing = (b.vx > 0) === (aiIdx() === 1);   // w stronę AI? (v0.3.0)
    if (G.aiComing && !wasComing)              // nowa piłka leci w stronę AI
      G.aiErr = (Math.random() * 2 - 1) * AI_ERR(G.hits);

    /* pudło: HVID wchodzi w blanking poziomy (krawędź ekranu) */
    if (b.x <= 0 || b.x >= VIS_W - BALL) {
      const missedLeft = b.x <= 0;
      const winner = missedLeft ? 1 : 0;
      G.score[winner]++;
      G.serveDir = missedLeft ? -1 : 1;       // serw do gracza, który spudłował
      G.serveVy = b.vy;                        // prędkość pionowa zachowana
      G.hits = 0;                              // reset prędkości poziomej (MISS)
      snd(SND_SCORE);
      if (G.score[winner] >= G.target) {       // STOPG → attract freeze
        G.state = "gameover"; G.overTimer = GAMEOVER_FIELDS;
        if (b.x < 0) b.x = -b.x; else if (b.x > VIS_W - BALL) b.x = 2 * (VIS_W - BALL) - b.x;
      } else {
        G.state = "serve"; G.serveTimer = SERVE_FIELDS;
      }
    }
  } else if (G.state === "gameover") {
    /* attract: piłka odbija się też od ścian bocznych, bez dźwięku i punktów */
    if (b.x <= 0) { b.x = -b.x; b.vx = -b.vx; }
    if (b.x >= VIS_W - BALL) { b.x = 2 * (VIS_W - BALL) - b.x; b.vx = -b.vx; }
  }
}

function startCountdown() {                    // v0.3.0: rozgrywka startuje od 3-2-1
  G.score = [0, 0]; G.hits = 0; G.serveVy = 0;
  G.serveDir = Math.random() < .5 ? -1 : 1;
  G.state = "count"; G.countF = COUNT_FIELDS;
}
function step() {
  G.fields++;
  stepPads();
  if (G.state === "count") {                   // odliczanie 3-2-1 (0,8 s na cyfrę)
    if (--G.countF <= 0) {
      G.state = "serve"; G.serveTimer = 1;     // po „1” piłka startuje natychmiast
    }
  } else if (G.state === "serve") {
    if (--G.serveTimer <= 0) {
      const b = G.ball;
      b.x = SERVE_X;                                   // [T2]
      b.y = Math.max(0, Math.min(VIS_H - BALL, G.pads[0].top + 1));  // sync PAD1 [T2]
      b.vx = G.serveDir * SPEED_BY_HITS(0);            // start = najwolniej
      b.vy = G.serveVy;                                 // prędkość z pudła
      G.aiComing = (b.vx > 0) === (aiIdx() === 1);
      if (G.aiComing) G.aiErr = (Math.random() * 2 - 1) * AI_ERR(G.hits);
      G.state = "play";
    }
  } else if (G.state === "play") {
    stepBall();
  } else {                                             /* gameover */
    stepBall();
    if (--G.overTimer <= 0) {                          // „moneta": nowa gra
      startCountdown();                       // v0.3.0: nowa rozgrywka od odliczania                     // odroczona zmiana geometrii kortu
    }
  }
}

/* --- pętla czasu ------------------------------------------------------------
   Piła przesuwa się raz na pole — jak w oryginale (60,054 Hz).               */
let last = 0, acc = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (!last) { last = t; return; }
  let dt = t - last; last = t;
  if (dt > 120) dt = 120;                     // karta w tle → bez nadrabiania
  acc += dt;
  let guard = 8;
  while (acc >= FIELD_MS && guard--) { step(); acc -= FIELD_MS; }
  render();
}
requestAnimationFrame(loop);
document.addEventListener("visibilitychange", () => {
  last = 0; acc = 0;                             // zegar od zera (bez skoku)
  if (!document.hidden) { Snd.recover(); refreshHint(); }  // audio mogło zasnąć w tle
});

/* --- wejście: klawiatura ---------------------------------------------------
   v0.3.1: OSTATNIE WEJŚCIE WYGRYWA — naciśnięcie klawisza sterującego
   przejmuje paletkę od myszy/dotyku (grabKeyboard). W v0.3.0 cel wskaźnika
   zapisany JEDNYM ruchem myszy nad kortem nadpisywał ruch klawiaturowy co
   pole — paletka „przyklejała się” do ostatniego Y myszy i W/S oraz
   strzałki pozornie nie działały. Blur okna (alt-tab) zwalnia klawisze,
   by po powrocie paletka nie uciekała sama.                              */
const keys = { p1u: false, p1d: false, p2u: false, p2d: false };
const KMAP = {
  KeyW: "p1u", KeyS: "p1d",
  ArrowUp: "p2u", ArrowDown: "p2d",
};
addEventListener("keydown", e => {
  if (e.code === "Escape") { exitGame(); return; }      // v0.3.0: Esc = wyjście z gry
  const k = KMAP[e.code];
  if (k) {
    keys[k] = true;
    if (e.code.startsWith("Arrow")) e.preventDefault();
    grabKeyboard(k);         // v0.3.1: klawisz zabiera paletkę myszy/dotyku
  }
  unlock();
});
addEventListener("keyup", e => { const k = KMAP[e.code]; if (k) keys[k] = false; });
addEventListener("blur", () => {          // v0.3.1: alt-tab z wciśniętym W/S/strzałką
  keys.p1u = keys.p1d = keys.p2u = keys.p2d = false;
  /* v0.3.4: alt-tab W ŚRODKU draga — mouseup po utracie fokusu nie musi
     dojść (stary „sticky drag”); wypruwamy wejścia przeciągania, paletka
     zostaje na ostatniej pozycji (semantyka v0.3.3). Trzymane palce odzyskają
     sterowanie po ponownym dotknięciu — jak w releaseAllPointers. */
  for (const k in touches) delete touches[k];
  if (mouseSlot >= 0) { pointer[mouseSlot] = null; mouseSlot = -1; }
});

/* --- wejście: palec = PRZECIĄGANIE względne, mysz = potencjometr ------------
   v0.3.6 (zgłoszenie Ciby: „paletka przeskakuje po odłożeniu palca”):
   dotyk NIE pozycjonuje paletki absolutnie — prowadzi ją DELTAMI od
   miejsca, w którym paletka jest. Podniesienie palca i położenie go w
   innym miejscu = ZERO przeskoków; tap = brak ruchu. v0.3.0: czuły na
   dotyk jest CAŁY EKRAN — nagłówek, ramki boczne i stopka też prowadzą
   paletkę (nie tylko pole gry). Pozycja Y gestu mapowana na linię kortu;
   X rozdziela graczy tylko w trybie 2P (połówki EKRANU, bo kort bywa
   węższy od ekranu). Gest na przycisku = klik przycisku (paletka nie
   skacze); mysz w spoczynku steruje tylko nad kortem (desktop).        */
const pointer = [null, null];                 // celowane pozycje TOP paletki
const touches = {};                           // pointerId -> {s: strona, y: kotwica Y}
let mouseSlot = -1;                           // v0.3.1: slot prowadzony TERAZ samym hoverem myszy
function releasePointer(i) { pointer[i] = null; }          // palec odzyska slot przy ruchu
function releaseAllPointers() {               // v0.3.1: zmiana strony/trybu — zero starych celów
  pointer[0] = pointer[1] = null;
  for (const k in touches) delete touches[k]; // trzymane palce odzyskają sterowanie po ponownym dotknięciu

}
function grabKeyboard(k) {                    // v0.3.1: OSTATNIE WEJŚCIE WYGRYWA — klawisz
  if (G.mode === 2) releasePointer(k[1] === "1" ? 0 : 1);  // 2P: W/S→lewa, ↑/↓→prawa
  else { releasePointer(0); releasePointer(1); }            // 1P: slot gracza + śmieci na slocie AI
}
function grabFocus() {                        // v0.3.1: iframe bez kliknięcia — klawisze szły
  if (!document.hasFocus()) { try { window.focus(); } catch (_) {} }  // do rodzica; mysz nad grą przechwytuje fokus
}
function fieldY(e) {                          // clientY -> linia kortu (clamp w clampPad)
  /* v0.3.3: mapa Y = CAŁA SCENA, nie sam pas kortu. W pionie kort zajmuje
     ~1/3 wysokości ekranu — dotyk nad/pod kortem SZTYWNO clampował paletkę
     do góry/dołu (palec „nie prowadził”). Teraz pełna scena mapuje się
     proporcjonalnie na pełny zakres paletki — „cały ekran czuły” dokładnie
     jak w poziomie (tam scena ≈ kort, więc odczuwalnie bez zmian).
     v0.3.6: dotyk liczy z tej mapy DELTY ruchu (czułość bez zmian, bez
     pozycjonowania absolutnego); mysz/hover bez zmian — absolutnie. */
  const r = stage.getBoundingClientRect();
  return (e.clientY - r.top) / r.height * VIS_H;
}
function sideFor(e) {                         // 2P: połowa EKRANU (nie kanwy)
  return e.clientX < innerWidth / 2 ? 0 : 1;
}
function onButton(e) {                        // gest na kontrolce = klik przycisku
  return !!(e.target && e.target.closest && e.target.closest("button"));
}
addEventListener("pointerdown", e => {
  if (onButton(e)) return;
  unlock(); e.preventDefault(); grabFocus();
  const s = (G.mode === 2) ? sideFor(e) : G.side - 1;   // 1P: slot wg strony gracza
  if (e.pointerType === "mouse") {            // v0.3.1: drag myszy — koniec trybu hover
    if (mouseSlot >= 0 && mouseSlot !== s) pointer[mouseSlot] = null;
    mouseSlot = -1;
  }
  touches[e.pointerId] = { s, y: fieldY(e) }; // v0.3.6: KOTWICA Y (stąd delty ruchu)
  /* v0.3.4: PRZECHWYCENIE POINTERA — gwarancja dostarczenia pointerup/cancel.
     Bez niego drag zwolniony POZA OKNEM przeglądarki (okno mniejsze od ekranu,
     gra w iframe na stronie klubu) gubił pointerup — wpis w `touches` żył dalej
     i każdy ruch myszy BEZ przycisku ciągnął paletkę jak drag, także nad UI
     („sticky drag”; tryb hover-tylko-nad-kortem był ominięty). Dla dotyku
     to no-op — ma implicite capture na celu dotyku. */
  try { if (e.target.setPointerCapture) e.target.setPointerCapture(e.pointerId); } catch (_) {}
  /* v0.3.6: DOTYK/RYSIK nie ustawia celu na Y palca (to robiło przeskok przy
     ponownym dotknięciu w innym miejscu) — chwyta paletkę TAM, GDZIE JEST,
     i ruszy dopiero od RUCHU palca (delta w pointermove). MYSZ bez zmian:
     kursor widoczny i ciągły → cel od razu pod kursorem (płynne hover↔drag). */
  if (e.pointerType === "mouse") pointer[s] = fieldY(e) - PAD_H / 2;
  else if (pointer[s] == null) pointer[s] = G.pads[s].top;
});
addEventListener("pointermove", e => {
  /* v0.3.4: SAMONAPRAWA ZGUBIONEGO UP — mysz/pen bez wciśniętego przycisku
     (buttons===0), a wpis w `touches` wciąż żyje = pointerup przepadł
     (przeglądarka nie dostarczyła, stary przypadek bez capture). Wypruwamy
     wpis BEZ zmiany pozycji — paletka zostaje tam, gdzie skończył się drag;
     dalsze ruchy to znów zwykły hover (nad kortem prowadzi, nad UI nic).
     Dotyk nie potrzebuje — podczas kontaktu buttons===1 zawsze. */
  if (e.pointerType !== "touch" && e.buttons === 0 && (e.pointerId in touches))
    delete touches[e.pointerId];
  /* mysz w spoczynku nad UI (przyciski/stopka/nagłówek) nie robi NIC —
     v0.3.0: bez rywania paletki i bez domyślnego dźwięku (decyzja dźwięku
     należy do gestu/przycisku; regresja B1 test_audio: hover po drodze
     do „Sound: Off” nie może włączać dźwięku przed kliknięciem) */
  if (e.pointerType === "mouse" && e.target !== cv && !(e.pointerId in touches)) return;
  if (e.pointerType === "mouse" && !(e.pointerId in touches))
    unlockSoft();                               // mysz bez kliku nad KORTEM → audio gotowe
  if (e.pointerType === "mouse" && !(e.pointerId in touches)) {
    grabFocus();                               // v0.3.1: fokus okna dla klawiatury (iframe)
    const s = (G.mode === 2) ? sideFor(e) : G.side - 1;
    if (mouseSlot >= 0 && mouseSlot !== s) pointer[mouseSlot] = null;  // hover: JEDEN slot
    pointer[s] = fieldY(e) - PAD_H / 2;
    mouseSlot = s;                            // zwolniony przez pointerleave/klawisz
  } else if (e.pointerId in touches) {          // palec/rysik lub mysz z przyciskiem
    const t = touches[e.pointerId];
    if (e.pointerType === "mouse") {
      pointer[t.s] = fieldY(e) - PAD_H / 2;     // mysz: absolutnie, spójnie z hoverem
    } else {                                    // v0.3.6: DOTYK = DELTA od kotwicy
      const y = fieldY(e), dy = y - t.y;        // ta sama mapa Y = ta sama czułość
      t.y = y;
      if (dy) {
        const base = (pointer[t.s] != null) ? pointer[t.s] : G.pads[t.s].top;
        pointer[t.s] = Math.max(PAD_MIN, Math.min(PAD_MAX, base + dy)); // bez martwej strefy
      }
    }
  }
});
/* v0.3.1: mysz ODESZŁA z kortu → zwolnij slot hovera (paletka zostaje na
   miejscu). Bez tego JEDEN ruch myszy nad kortem przyklejał paletkę do
   ostatniego Y na zawsze — „zabijał” W/S (cel wskaźnika nadpisywał ruch
   klawiaturowy co pole), a po zmianie strony także AI (stary cel na nowym
   slocie AI). Drag (przycisk wciśnięty) trwa dalej — zwalnia go pointerup. */
cv.addEventListener("pointerleave", e => {
  if (e.pointerType !== "mouse" || e.pointerId in touches) return;
  if (mouseSlot >= 0) { pointer[mouseSlot] = null; mouseSlot = -1; }
});
const endPtr = e => {
  /* v0.3.6: KONIEC KONTAKTU NIE PORUSZA PALETKI (życzenie Ciby: „ruch paletki
     bez przeskoków, nawet gdy użytkownikowi zdarzy się utracić kontakt z
     ekranem”). Dotyk/rysik: pointerup/pointercancel zostawia cel BEZ ZMIAN —
     paletka stoi, gdzie stoi; nowy dotyk to nowa kotwica, a ruch paletki
     następuje dopiero od RUCHU palca (delta). Do v0.3.5 puszczenie palca
     zostawiało ostatnie Y palca jako cel (v0.3.3 „tap też pozycjonuje”),
     a ponowne dotknięcie w innym miejscu przeskakiwało paletką na miejsce
     palca — dokładnie zgłoszony błąd. MYSZ: kursor ciągły → cel = pozycja
     kursora przy puszczeniu (płynne przejście do hovera; klik-tap na
     desktopie nadal pozycjonuje). */
  if (e.pointerId in touches) {
    if (e.pointerType === "mouse") pointer[touches[e.pointerId].s] = fieldY(e) - PAD_H / 2;
    delete touches[e.pointerId];
  }
  /* v0.3.4: higiena — zwolnij przechwycenie z pointerdown (zwykle robi to
     sam przeglądarka na up/cancel; tu dla pewności, np. po samonaprawie) */
  try {
    if (e.target && e.target.releasePointerCapture && e.target.hasPointerCapture(e.pointerId))

  } catch (_) {}

addEventListener("pointerup", endPtr);
addEventListener("pointercancel", endPtr);

/* --- odblokowanie dźwięku po 1. interakcji --------------------------------
   unlock() wołany przy KAŻDYM geście (nie tylko pierwszym): gdy system uśpił
   audio (tło/przerwanie iOS), następny gest natychmiast je budzi I odgrywa
   dźwięki odłożone w czasie snu (Snd.flush). Pełna lista zdarzeń aktywujących
   (gestów w polityce autoplay): pointerdown, pointerup — PUŚCZENIE palca/
   przycisku też (iOS często budzi audio dopiero na końcu dotyku, a przeciąganie
   paletki nie generuje click), touchstart, touchend, click, klawisz.
   unlockSoft() — sama obecność gracza (prowadzenie paletki myszą bez kliku):
   przygotowuje audio i podpowiada w stopce, że do dźwięku trzeba gestu
   (pointermove nie liczy się jako gest w polityce autoplay).                */
let soundDecided = false;      // czy zastosowano już domyślne „dźwięk włączony”?
function ensureAudio(applyDefault = true) {
  Snd.init();
  if (!soundDecided && applyDefault) {
    soundDecided = true;
    /* decyzja projektu: dźwięk włącza się razem z 1. interakcją, chyba że
       użytkownik wcześniej wyraźnie go wyłączył (zapamiętane w localStorage) */
    if (prefs().sound === undefined) Snd.on = true;
    applySound();
  }
}
function unlock(e) {            // pełne odblokowanie — wyłącznie prawdziwy gest
  /* pierwszy gest NIE może być kliknięciem samego włącznika dźwięku —
     pointerdown bąbelkuje do okna WCZEŚNIEJ niż click, więc domyślna
     polityka zdążyłaby włączyć dźwięk przed togglem i klik w „Sound: Off”
     zostawiałby OFF na zawsze; wtedy decyzja należy wyłącznie do przycisku */
  const fromToggle = !!(e && e.target && e.target.id === "bsnd");
  ensureAudio(!fromToggle);
  Snd.recover();
  Snd.burst();
  refreshHint();
}
function unlockSoft() {        // obecność bez gestu — bez resume (i tak się nie uda)
  ensureAudio();
  refreshHint();
}
addEventListener("pointerdown", unlock);
addEventListener("pointerup", unlock, { passive: true });  // puszczenie palca/przycisku
addEventListener("touchstart", unlock, { passive: true });
addEventListener("touchend", unlock, { passive: true });   // iOS budzi audio na touchend
addEventListener("click", unlock);

/* --- UI -------------------------------------------------------------------- */
const $ = id => document.getElementById(id);
function prefs() { try { return JSON.parse(localStorage.getItem("pong72") || "{}"); } catch { return {}; } }
function savePrefs() { try { localStorage.setItem("pong72", JSON.stringify({ mode: G.mode, side: G.side, target: G.target, sound: Snd.on })); } catch {} }

function resetGame() {                   // v0.3.0: każdy start rozgrywki = odliczanie 3-2-1
  startCountdown();                   // geometria oczekująca na koniec wymiany
}
function refreshUI() {
  $("b1p").classList.toggle("on", G.mode === 1);
  $("b2p").classList.toggle("on", G.mode === 2);
  $("bside").textContent = "Player: " + (G.side === 2 ? "Right" : "Left");  // v0.3.0
  $("bto").textContent = "Game to " + G.target;
  $("bsnd").textContent = "Sound: " + (Snd.on ? "On" : "Off");
  $("bsnd").classList.toggle("on", Snd.on);
}
/* stopka mówi wprost, kiedy dźwięk jeszcze śpi — żeby brak dźwięku nie był zagadką */
const HINT_CTRL = "W/S · ↑/↓ · MOUSE · TOUCH (DRAG)";
const HINT_MUTE = "SOUND ASLEEP — CLICK / TAP / ANY KEY";
let hintTxt = "";
function refreshHint() {
  const mute = Snd.on && !Snd.running();       // audio włączone, ale kontekst śpi
  const txt = mute ? HINT_MUTE : HINT_CTRL;
  const el = $("hint");
  if (txt !== hintTxt) { hintTxt = txt; el.textContent = txt; }
  el.classList.toggle("muted", mute);          // puls kolorem klubu = „zajrzyj tu”
}
function applySound() { refreshUI(); refreshHint(); savePrefs(); }
/* v0.3.1: zmiana trybu/strony = zerowanie celów wskaźnika — stary cel ze
   slotu, który zostaje AI, zamrażał paletkę AI po przełączeniu */
$("b1p").onclick = () => { unlock(); G.mode = 1; releaseAllPointers(); resetGame(); refreshUI(); savePrefs(); };
$("b2p").onclick = () => { unlock(); if (G.mode !== 2) { G.mode = 2; releaseAllPointers(); resetGame(); } refreshUI(); savePrefs(); };
$("bto").onclick  = () => { unlock(); G.target = G.target === 11 ? 15 : 11; resetGame(); refreshUI(); savePrefs(); };
/* v0.3.0: wybór strony gracza w 1P (domyślnie PRAWA — życzenie Ciby);
   zmiana strony = nowa rozgrywka (odliczanie 3-2-1); v0.3.1: + zwolnienie
   wskaźników — AI gra PRZECIWNIKA, nie dziedziczy zamrożonego celu */
$("bside").onclick = () => { unlock(); G.side = G.side === 2 ? 1 : 2; releaseAllPointers(); resetGame(); refreshUI(); savePrefs(); };
/* v0.3.5: wyjście z gry — przycisk EXIT albo Esc = zawsze „BACK” (życzenie
   Ciby): wracamy na STRONĘ WEJŚCIA, bo grę ładujemy w tej samej karcie
   (popupy nie działają na iPhone). ENTRY liczone raz przy starcie:
   ?back=<http(s) | /ścieżka> (strona klubu może podać dokładny link)
   → document.referrer (karta/iframe otwarte z linku). Filtr http(s)/ścieżka
   — ?back=javascript: nie przejdzie. Kolejność prób:
   (1) ENTRY → location.replace: celowo NIE history.back() — wstecz
       wskoczyłby na pustą kartę/stronę startową, gdy link otwarto w NOWEJ
       karcie (historia karty ≠ droga wejścia); replace nie zostawia też
       wpisu gry w historii — „forward” po wyjściu nie wraca do gry;
   (2) brak ENTRY (referrer wycięty polityką prywatności) → wstecz
       w historii karty + bezpiecznik: bez pagehide w 400 ms → „../”
   (3) karta bez historii i ENTRY → window.close() (okno otwarte
       skryptem), a gdy przeglądarka odmówi — „../”;
   (4) iframe: ping pong:exit z polem back; brak ACK przez 600 ms =
       wracamy SAMI nawigacją top (działa przy tym samym originie;
       cross-origin blokuje przeglądarka — zostaje ping).
   v0.3.8 (dialog_ze_strona.md RUNDA 1/2 — propozycje P1–P4 strony klubu,
   wdrożone po mojej stronie w tej wersji):
   P1 — ACK: po ping gra czeka do 600 ms na {type:'pong:exit-ack'}.
       Doszło ACK = rodzic PRZEJMUJE wyjście → timer samonaprawy gaszony
       (P4: przy ACK nawigację prowadzi STRONA — back()/panel; gra nie
       rusza top). Brak ACK = samonaprawa jak dotychczas — EXIT nie umiera
       w obcych osadzeniach bez protokołu.
   P2 — set-back: w srcdoc location.search="" i document.referrer=""
       (F1 Zeta — ?back= i referrer nie docierają), więc ENTRY może
       nadpisać RODZIC: {type:'pong:set-back', back:<pełny URL>} — ten sam
       filtr http(s)/ścieżka co ?back=; strona wysyła po odebraniu
       pong:version (listener gry wisi przed ogłoszeniem — bez wyścigu).
   P3 — fallback „../”: samodzielnie otwarty mirror (…/gra/pong.html
       z wyszukiwarki/zakładki) wraca do KORZENIA strony klubu, nie na „/”
       (GitHub Pages projektowe: „/” = 404 → github.com). W srcdoc
       location.href=about:srcdoc → URL() rzuca → zostaje „/” (tam i tak
       rządzi P1/P2). Kolejność celu samonaprawy: ENTRY → „../” → „/”.
   Pełny ekran już NIE wstrzymuje wyjścia (do v0.3.4 Esc wychodził tylko
   z FS): FS zwalniamy w tle (od v0.3.8 z zagaszonym .catch — Q2), nawigacja
   i tak go kończy. Flag „exiting” (reset na pageshow — powrót z bfcache):
   podwójny Esc albo Esc+klik nie odpala wyjścia dwa razy i nie cofa
   historii o 2 pozycje. */
let ENTRY = (() => {
  let u = "";
  try { u = new URLSearchParams(location.search).get("back") || ""; } catch (_) {}
  if (u.startsWith("/") && !u.startsWith("//")) u = location.origin + u;  // /ścieżka, nie //host
  if (!u) u = document.referrer || "";
  return /^https?:/i.test(u) ? u : "";
})();
/* P3 (v0.3.8): katalog wyżej = korzeń strony klubu z samodzielnie
   otwartego mirroru; about:srcdoc → new URL rzuca → "" (zostaje „/”). */
const FALLBACK_UP = (() => {
  try {
    const u = new URL("../", location.href);
    return /^https?:/i.test(u.protocol) ? u.href : "";
  } catch (_) { return ""; }
})();
/* P2 (v0.3.8): ENTRY nadpisany przez rodzica — wspólny filtr z ?back= */
function setBack(u) {
  if (typeof u !== "string") return;
  if (u.startsWith("/") && !u.startsWith("//")) u = location.origin + u;
  if (/^https?:/i.test(u)) ENTRY = u;
}
let exiting = false;
let exitFuse = 0;   // P1 (v0.3.8): timer samonaprawy — do rozbrojenia przez pong:exit-ack
function exitGame() {
  if (exiting) return; exiting = true;
  try {
    if (document.fullscreenElement) {
      const p = document.exitFullscreen();               // Q2: iOS nie ma element-FS
      if (p && p.catch) p.catch(() => {});               // → tu no-op; obietnica zgaszona
    }
  } catch (_) {}
  let framed = false;
  try { framed = window.self !== window.top; } catch (_) { framed = true; }
  if (framed) {
    const msg = { type: "pong:exit" };
    if (ENTRY) msg.back = ENTRY;
    try { window.top.postMessage(msg, "*"); } catch (_) {}
    exitFuse = setTimeout(() => {   // rodzic nie ACKował w 600 ms? wracamy sami
      exitFuse = 0;
      try { if (window.self !== window.top) window.top.location.replace(ENTRY || FALLBACK_UP || "/"); } catch (_) {}
    }, 600);
    return;
  }
  if (ENTRY) { try { location.replace(ENTRY); } catch (_) {} return; }
  if (history.length > 1) {
    let gone = false;
    addEventListener("pagehide", () => { gone = true; }, { once: true });
    try { history.back(); } catch (_) {}
    setTimeout(() => { if (!gone) try { location.replace(FALLBACK_UP || "/"); } catch (_) {} }, 400);
    return;
  }
  try { window.close(); } catch (_) {}
  setTimeout(() => { try { location.replace(FALLBACK_UP || "/"); } catch (_) {} }, 300);
}
addEventListener("pageshow", () => {   // powrót bfcache = Exit znów działa
  exiting = false;
  if (exitFuse) { clearTimeout(exitFuse); exitFuse = 0; }   // P1: stary zapłon nie może strzelić po powrocie
});
$("bexit").onclick = () => { unlock(); exitGame(); };
/* Kolejność celowa: klik w włącznik = ŚWIADOMA decyzja (nie nadpisuj jej później
   domyślną polityką „dźwięk on po 1. interakcji”); przełącz stan WYŚWIETLANY,
   potem budź audio. W v0.1.1 unlock() najpierw włączał domyślny dźwięk, a `!Snd.on`
   zaraz go wyłączał — klik w „Sound: Off” zostawiał cichą grę NA ZAWSZE:
   zapis „sound:false” w localStorage wyciszał też wszystkie następne sesje. */
$("bsnd").onclick = () => {
  soundDecided = true;
  Snd.on = !Snd.on;
  ensureAudio(); Snd.recover(true); Snd.burst();
  applySound();
};

/* przywrócenie preferencji */
(() => {
  const p = prefs();
  /* v0.2.1: „2 Players” ukryte → gra zawsze startuje w 1P; stary zapis
     mode:2 nie uwięzi gry w trybie, którego nie da się przełączyć */
  if (p.mode === 1) G.mode = 1;
  if (p.side === 1 || p.side === 2) G.side = p.side;      // v0.3.0: strona gracza
  if (p.target === 11 || p.target === 15) G.target = p.target;
  if (p.sound) Snd.on = true;               // dźwięk zadziała dopiero po odblokowaniu
  refreshUI(); refreshHint();
})();

/* --- dopasowanie rozmiaru + adaptacyjny kort (v0.3.0) -----------------------
   Zasady geometrii (życzenia Ciby, 2026-11-06):
   1. Kort NIGDY nie jest szerszy niż 16:9 (CY_MAX=500) — koniec „zbyt
      rozciągniętej” gry na desktopie; szersze okna dostają pasy boczne.
   2. Telefon w poziomie: po lewej i prawej RAMKI o szerokości 1/6 EKRANU →
      kort zajmuje dokładnie 2/3 szerokości ekranu (mniej rozciągnięty;
      kap 16:9 nie obowiązuje — granicą jest sama ramka).
   3. Zmiana orientacji/rozmiaru = przerys NATYCHMIAST, także w trakcie
      wymiany: piłka w locie przenoszona proporcjonalnie, paletki dociskane
      do zakresu — nic nie czeka do końca punktu (v0.2.x odkładało zmianę).
      Pilnuje tego ResizeObserver na scenie + resize/orientationchange/
      screen.orientation.change (telefon potrafi zgłosić zmianę, zanim
      przeliczy layout — stąd ponawiane próby).
   4. Wysokość świata = 246 linii jak w oryginale; skala bez zmian (4 px/cykl)
      — kształty i fizyka (cykle/pole) identyczne.
   5. Siatka DOKŁADNIE na środku kortu (v0.3.7, życzenie Ciby: „pole gry musi
      być symetryczne”) — połówki równe co do piksela w każdym widoku i
      orientacji; oryginalna asymetria (12 cykli w lewo) tylko w ?classic=1.
   ?classic=1 = dokładna geometria oryginału (4:3, paletki 128H/384H).
   Szczegóły i wzory: docs/badania.md §12 i §14.                              */
const FORCE_CLASSIC = new URLSearchParams(location.search).get("classic") === "1";
const stage = document.getElementById("stage");

function isPhoneLandscape() {                  // telefon w poziomie (dotyk + krótki bok ≤540)
  return matchMedia("(pointer: coarse)").matches
      && innerWidth > innerHeight && Math.min(innerWidth, innerHeight) <= 540;
}
function courtCyclesFor(ar) {                  // ar = proporcje dostępnego miejsca
  if (FORCE_CLASSIC) return CY_MIN;
  return Math.max(CY_MIN, Math.min(CY_MAX, Math.round(ar * 280.5)));
}
function applyCourt(w) {                       // świat pod kort o szerokości w cykli
  /* v0.2.2: bez `if (w === VIS_W) return` — layout wyliczony także dla
     w === 374 (start w pionie/kwadracie i tryb ?classic). */
  const oldW = VIS_W;
  VIS_W = w;
  NET_X = FORCE_CLASSIC ? (w >> 1) - 12 : (w >> 1);  // v0.3.7: ŚRODEK (Ciba — pole symetryczne); classic: quirka [T5]
  if (FORCE_CLASSIC) { PAD_X1 = 47; PAD_X2 = 303; }        // 128H/384H-81 (oryginał)
  else { const e = padEdge(w); PAD_X1 = e; PAD_X2 = w - e - PAD_W; }  // ~4,5% od krawędzi (v0.2.2)
  SERVE_X = NET_X + 1;                         // [T2] serw tuż na prawo od siatki
  SC1 = [PAD_X1 + 16, PAD_X1 + 48];            // okna wyniku przy paletkach (jak w oryginale)
  SC2 = [PAD_X2 - 48, PAD_X2 - 16];
  cv.width = w * 4;                            // wysokość 1122 px bez zmian
  /* v0.3.0: przerys zawsze — także W TRAKCIE wymiany (decyzja Ciby):
     piłka w locie przenoszona proporcjonalnie, paletki dociskane do zakresu */
  G.ball.x = Math.max(0, Math.min(w - BALL, Math.round(G.ball.x * w / oldW)));
  G.pads[0].top = clampPad(G.pads[0].top);
  G.pads[1].top = clampPad(G.pads[1].top);
}
function requestCourt(w) {                     // v0.3.0: bez odkładania — od razu
  if (w !== VIS_W) applyCourt(w);
}
function fit() {
  const r = stage.getBoundingClientRect();
  const availW = Math.max(120, r.width - 20), availH = Math.max(90, r.height - 20);
  /* telefon w poziomie: ramki dokładnie 1/6 EKRANU po bokach → kort = 2/3
     szerokości ekranu (v0.3.0, decyzja Ciby). W tym trybie NIE działa kap 16:9 —
     górna granica to sama ramka (CY_PHONE_MAX); przy bardzo krótkiej scenie
     dodatkowy letterbox góra/dół. */
  const phone = !FORCE_CLASSIC && isPhoneLandscape();
  const maxW = phone ? Math.min(availW, innerWidth * 2 / 3) : availW;
  const cap = phone ? CY_PHONE_MAX : CY_MAX;
  requestCourt(FORCE_CLASSIC ? CY_MIN :
    Math.max(CY_MIN, Math.min(cap, Math.round(maxW / availH * 280.5))));
  const ar = VIS_W * 4 / 1122;                 // proporcje kortu (4:3 … 16:9; telefon: ~2:1)
  let w = maxW, h = w / ar;
  if (h > availH) { h = availH; w = h * ar; }
  cv.style.width = w + "px";
  cv.style.height = h + "px";
}
addEventListener("resize", fit);
addEventListener("orientationchange", () => { fit(); setTimeout(fit, 120); setTimeout(fit, 350); });
try { screen.orientation && screen.orientation.addEventListener("change",
  () => { fit(); setTimeout(fit, 120); setTimeout(fit, 350); }); } catch (_) {}
try { new ResizeObserver(() => fit()).observe(stage); } catch (_) {}  // pewniak: każdy przesuw layoutu
applyCourt(CY_MIN);        // spójny layout od 1. klatki (klasyka lub ~4,5% od krawędzi)
fit();

/* hook testowy/kalibracyjny (nie wpływa na rozgrywkę) */
window.__pong = { G, Snd, FIELD_HZ, PAD_MIN, PAD_MAX, VERSION,
  get VIS_W() { return VIS_W }, get NET_X() { return NET_X },
  get PAD_X1() { return PAD_X1 }, get PAD_X2() { return PAD_X2 },
  get SC1() { return SC1 }, get SC2() { return SC2 },
  get aiIdx() { return aiIdx() },
  courtCyclesFor, applyCourt, fit,
  getVersion: () => ({ game: "pong-1972-replica", version: VERSION,
                       released: RELEASE }) };

/* v0.3.2: MASZYNOWO CZYTELNA WERSJA — strona klubu i agent AI zawsze wiedzą,
   którą wersją grają. Kanały: version.json obok pliku, meta[name=game-version],
   html[data-version], tytuł karty, plakietka nagłówka, window.__pong.getVersion(),
   komunikat startowy w konsoli + postMessage:
     gra    -> rodzic: {type:'pong:version', game, version, released}
     rodzic -> gra:    {type:'pong:get-version'}  → ponowne ogłoszenie wersji
   v0.3.8 (dialog_ze_strona.md, P1–P4):
     rodzic -> gra:    {type:'pong:set-back', back}   → ENTRY dla srcdoc (P2)
     rodzic -> gra:    {type:'pong:exit-ack'}         → rodzic przejął wyjście (P1/P4) */
function announceVersion() {
  try {
    if (window.parent !== window)
      window.parent.postMessage(
        { type: "pong:version", game: "pong-1972-replica",
          version: VERSION, released: RELEASE }, "*");
  } catch (_) {}
}
addEventListener("message", (e) => {
  const d = e.data;
  if (!d || typeof d.type !== "string") return;
  if (d.type === "pong:get-version") { announceVersion(); return; }
  if (d.type === "pong:set-back") { setBack(d.back); return; }     // P2: ENTRY z rodzica
  if (d.type === "pong:exit-ack" && exiting && exitFuse) {         // P1/P4: rodzic
    clearTimeout(exitFuse); exitFuse = 0;                          // przejął wyjście —
  }                                                                // samonaprawa rozbrojona
});
try {   // spójność statycznych atrybutów (dla parserów bez JS) z kodem gry
  document.documentElement.dataset.version = VERSION;
  document.querySelector('meta[name="game-version"]').setAttribute("content", VERSION);
  document.querySelector(".ver").textContent = "v" + VERSION;
} catch (_) {}
announceVersion();
console.log("[PONG] v" + VERSION + " · replika Atari 1972 · wersja też w: " +
            "version.json / meta[name=game-version] / html[data-version]");
</script>
</body>
</html>
